<div class="h-screen w-screen overflow-hidden bg-black text-main select-none relative">

  <!-- =========================================================================
       STAGE PRINCIPAL (Se desenfoca y retrocede en bloque con stage-recessed)
       ========================================================================= -->
  <div id="app-stage"
    [class]="dialogService.isDialogOpen() || dialogService.isHeroExpanded() ? 'stage-recessed' : 'stage-normal'"
    class="flex h-full w-full overflow-hidden bg-surface">

    <!-- 1. NAVEGACIÓN (Rail / Tunnel / Dock) -->
    <app-navigation [navStyle]="dialogService.navStyle()" [currentSection]="currentSection()"
      [pendingCount]="taskService.pendingCount()" [isDialogOpen]="dialogService.isDialogOpen()"
      [isHeroExpanded]="dialogService.isHeroExpanded()" [activeTrigger]="dialogService.activeTrigger()"
      [activeTransition]="dialogService.activeTransition()" (openMenu)="dialogService.openFrom($event)" />

    <!-- 2. CONTENIDO PRINCIPAL CON ROUTER OUTLET -->
    <main
      [class]="currentSection() === 'pos' || currentSection() === 'inventory' || currentSection() === 'telemetry' || currentSection() === 'kanban' || currentSection() === 'campus' || currentSection() === 'clinic' ? 'flex-1 h-full overflow-hidden p-2 md:p-3 flex flex-col min-h-0' : 'flex-1 overflow-y-auto p-6 md:p-8 pb-28 space-y-6'">

      <!-- BARRA SUPERIOR (Oculta en POS, Inventory, Telemetry, Kanban, Campus y Clinic para foco operativo) -->
      @if (currentSection() !== 'pos' && currentSection() !== 'inventory' && currentSection() !== 'telemetry' && currentSection() !== 'kanban' && currentSection() !== 'campus' && currentSection() !== 'clinic') {
      <app-header class="shrink-0" [currentSection]="currentSection()" [navStyle]="dialogService.navStyle()"
        [isDialogOpen]="dialogService.isDialogOpen()" [activeTrigger]="dialogService.activeTrigger()"
        (openCreate)="dialogService.openFrom($event)" />
      }

      <!-- ENTRADA DE VISTAS (Overview, Agenda, Design System, POS) -->
      <router-outlet />

    </main>
  </div>

  <!-- 3. HERO CARD EXPANDIDA A PANTALLA COMPLETA -->
  <app-hero-detail-modal [isHeroExpanded]="dialogService.isHeroExpanded()"
    [activeTransition]="dialogService.activeTransition()" [completionRate]="taskService.completionRate()"
    [completedCount]="taskService.completedCount()" [pendingCount]="taskService.pendingCount()"
    (close)="dialogService.toggleHeroDetail(false)" />

  <!-- 4. CONTENEDOR TRANSFORMABLE MULTIPROPÓSITO -->
  <app-dialog-container [isDialogOpen]="dialogService.isDialogOpen()" [activeTrigger]="dialogService.activeTrigger()"
    [dialogView]="dialogService.dialogView()" [navStyle]="dialogService.navStyle()"
    [activeTaskId]="dialogService.activeTaskId()" [(draftTitle)]="dialogService.draftTitle"
    [(draftCategory)]="dialogService.draftCategory" [(draftDate)]="dialogService.draftDate"
    [(draftPriority)]="dialogService.draftPriority" [(draftNotes)]="dialogService.draftNotes"
    (closeDialog)="dialogService.closeDialog()" (saveTask)="dialogService.saveTask()"
    (deleteTask)="dialogService.deleteActiveTask()"
    (morphView)="dialogService.morphDialogInternalView($event.targetView, $event.moveCenter)"
    (navStyleChange)="dialogService.setNavStyle($event)" />

</div>
