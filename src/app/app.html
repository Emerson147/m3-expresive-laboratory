@let isStageRecessed = dialogService.isDialogOpen() || dialogService.isHeroExpanded() || stageOverlay.isOverlayOpen();
<div
  [class]="isStageRecessed ? 'bg-black' : 'bg-surface-low'"
  class="h-dvh w-full overflow-hidden text-main select-none relative">

  <!-- =========================================================================
       STAGE PRINCIPAL (Chrome persistente + Route Stage aislado)
       ========================================================================= -->
  <div id="app-stage"
    [class]="(isStageRecessed ? 'stage-recessed ' : 'stage-normal ') + stageClasses()"
    [attr.inert]="isStageRecessed ? '' : null">

    <!-- 1. NAVEGACIÓN ADAPTATIVA M3 (Bar Compact / Detached Rail / Top Focus Strip / Curated Dock) -->
    <app-navigation
      [navStyle]="dialogService.navStyle()"
      [(manualRailExpanded)]="dialogService.isRailManuallyExpanded"
      [currentSection]="currentSection()"
      [pendingCount]="taskService.pendingCount()"
      [isDialogOpen]="dialogService.isDialogOpen()"
      [activeTrigger]="dialogService.activeTrigger()"
      [activeTransition]="dialogService.activeTransition()"
      (openMenu)="dialogService.openFrom($event)"
      (openCommandPalette)="openCommandPalette()"
      (exitTunnel)="dialogService.setNavStyle('auto')" />

    <!-- 2. PANE DE CONTENIDO / ROUTER STAGE (Única zona animada al navegar) -->
    <main #routeStage id="route-stage" tabindex="-1" [class]="mainClasses()">

      <!-- BARRA SUPERIOR (Editorial / Overview / Agenda / Design System) -->
      @if (isEditorialShell()) {
      <app-header
        class="shrink-0"
        [currentSection]="currentSection()"
        [chromeMode]="dialogService.effectiveChrome()"
        [sectionTitle]="routeMeta().title"
        [sectionSubtitle]="routeMeta().subtitle"
        (openCommandPalette)="openCommandPalette()" />
      }

      <!-- ENTRADA DE VISTAS -->
      <router-outlet />

    </main>
  </div>

  <!-- 3. HERO CARD EXPANDIDA A PANTALLA COMPLETA -->
  <app-hero-detail-modal [isHeroExpanded]="dialogService.isHeroExpanded()"
    [activeTransition]="dialogService.activeTransition()" [completionRate]="taskService.completionRate()"
    [completedCount]="taskService.completedCount()" [pendingCount]="taskService.pendingCount()"
    (close)="dialogService.toggleHeroDetail(false)" />

  <!-- 4. CONTENEDOR TRANSFORMABLE MULTIPROPÓSITO -->
  <app-dialog-container [isDialogOpen]="dialogService.isDialogOpen()" [activeTrigger]="dialogService.activeTrigger()"
    [activeTransition]="dialogService.activeTransition()"
    [dialogView]="dialogService.dialogView()" [navStyle]="dialogService.navStyle()"
    [activeTaskId]="dialogService.activeTaskId()" [(draftTitle)]="dialogService.draftTitle"
    [(draftCategory)]="dialogService.draftCategory" [(draftDate)]="dialogService.draftDate"
    [(draftTimeSlot)]="dialogService.draftTimeSlot" [(draftDuration)]="dialogService.draftDuration"
    [(draftPriority)]="dialogService.draftPriority" [(draftNotes)]="dialogService.draftNotes"
    (closeDialog)="dialogService.closeDialog()" (saveTask)="dialogService.saveTask()"
    (deleteTask)="dialogService.deleteActiveTask()"
    (morphView)="dialogService.morphDialogInternalView($event.targetView, $event.moveCenter)"
    (navStyleChange)="dialogService.setNavStyle($event)" />

  <!-- 5. PORTAL EXTERNO PARA MODALES DE MÓDULOS LAZY (POS, Clínica, etc.) -->
  @if (stageOverlay.overlayTemplate(); as featureOverlay) {
    <ng-container
      [ngTemplateOutlet]="featureOverlay"
      [ngTemplateOutletInjector]="stageOverlay.overlayInjector()" />
  }

  <!-- 6. PALETA DE COMANDOS GLOBAL (Ctrl/Cmd + K sobre Top Layer nativo) -->
  <app-command-palette
    [isOpen]="isCommandPaletteOpen()"
    [currentSection]="currentSection()"
    (closed)="isCommandPaletteOpen.set(false)"
    (navigate)="navigateFromCommandPalette($event)"
    (openQuickTask)="openQuickTaskFromCommandPalette()" />

</div>
